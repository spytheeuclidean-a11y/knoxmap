name: knoxroute

# The Rust road router (rust/knoxroute), built on each system and tested there.
#
# The road layouts that follow the game's own streets (Vanilla curves) route every
# street through it (generator/roadgraph/rustsearch.py): beside KnoxMap.exe in a
# release, or in rust/knoxroute/target/release after `cargo build --release`.
# Without it the same search runs in Python, about a hundred times slower - a town
# took minutes and a city days - so the release workflow calls this one and puts
# each system's binary in that system's download, as it does knoxlots.
on:
  push:
    paths: ["rust/knoxroute/**", ".github/workflows/knoxroute.yml"]
  pull_request:
    paths: ["rust/knoxroute/**", ".github/workflows/knoxroute.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: knoxroute (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: windows, os: windows-latest, exe: knoxroute.exe}
          - {system: linux,   os: ubuntu-latest,  exe: knoxroute}
          - {system: macos,   os: macos-latest,   exe: knoxroute}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test
        working-directory: rust/knoxroute
        run: cargo test --release --locked

      - name: Build
        working-directory: rust/knoxroute
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: knoxroute-${{ matrix.system }}
          path: rust/knoxroute/target/release/${{ matrix.exe }}
          if-no-files-found: error
