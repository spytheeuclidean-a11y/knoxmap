name: release

# Push a tag like v1.3.7, or publish a release by hand on GitHub, and this
# makes the download players get: the same checks as every push, then one
# file per system with that version's CHANGELOG section as the notes.
#
# Windows gets a zip, which Explorer opens without anything installed. Linux
# and macOS get tarballs, because a zip has no executable bit and ./setup.sh
# would not run out of one. Each carries only the launchers for its own
# system, so nobody has to work out which of four files to double-click.
#
# A fix that only matters on one system is released for that system alone:
# tag it v1.3.9-mc1 and only the macOS file is built and published, and the
# other systems stay where they are. v1.3.9 with no suffix is for everyone.
#
# A release with no files on it is invisible to the updater - there is
# nothing for it to download - so 1.4.1, tagged without the v and published
# by hand, never reached anybody's update menu. Both routes end in the same
# place now:
#
#   - pushing a tag, with the v or without it
#   - Draft a new release on GitHub, which fires release: published
#
# and whichever happens second finds the files already there. A release this
# workflow creates itself starts no second run: events made with
# GITHUB_TOKEN never trigger workflows.
on:
  push:
    tags: ["v*", "[0-9]*"]
  release:
    types: [published]

jobs:
  # The map compiler is published from this repository too, under tags like
  # worlded-cli-linux-20260909f, and those are not KnoxMap. This is the rule
  # updater.VERSION_TAG applies at the other end: a tag is a release of
  # KnoxMap when it is a version, optionally with a name after it.
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ours: ${{ steps.tag.outputs.ours }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -eu
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if printf '%s' "$TAG" | grep -Eq '^v?[0-9]+(\.[0-9]+){0,3}(-[a-z]+[0-9]*)?$'; then
            echo "ours=yes" >> "$GITHUB_OUTPUT"
            echo "$TAG is a KnoxMap release"
          else
            echo "ours=no" >> "$GITHUB_OUTPUT"
            echo "$TAG is not a KnoxMap version; nothing to release"
          fi

  checks:
    needs: gate
    if: needs.gate.outputs.ours == 'yes'
    uses: ./.github/workflows/checks.yml

  # Builds KnoxMap.exe and runs it on a Windows runner before anything is
  # published: the launcher cannot be tested on the machine it is written on.
  launcher:
    needs: gate
    if: needs.gate.outputs.ours == 'yes'
    uses: ./.github/workflows/launcher.yml

  # The Rust map compiler, built and tested on each system. Each download carries its
  # own system's binary beside the launcher; KnoxMap uses it when it is there.
  knoxlots:
    needs: gate
    if: needs.gate.outputs.ours == 'yes'
    uses: ./.github/workflows/knoxlots.yml

  release:
    needs: [gate, checks, launcher, knoxlots]
    if: needs.gate.outputs.ours == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: KnoxMap-exe

      - uses: actions/download-artifact@v4
        with:
          pattern: knoxlots-*
          path: knoxlots

      - name: Which version, and which systems it is for
        id: which
        run: |
          set -eu
          # The tag may carry the v or not. The files always do, because the
          # updater looks for KnoxMap-v<version>-<system>.
          version="${TAG#v}"
          # A suffix that names a system means that system alone. Any other
          # suffix is just a name for the release - v1.3.9-rnd was the
          # pictures - and goes out to everybody, same as a bare version.
          case "${TAG##*-}" in
            mac*|mc*)     systems=macos ;;
            win*|w[0-9]*) systems=windows ;;
            lin*|l[0-9]*) systems=linux ;;
            *)            systems="windows linux macos" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "systems=$systems" >> "$GITHUB_OUTPUT"
          echo "$TAG is KnoxMap $version for: $systems"

      - name: The changelog is on this version
        env:
          VERSION: ${{ steps.which.outputs.version }}
        run: |
          set -eu
          # knoxlog.version() reports the first "## " heading in the changelog
          # and nothing else, and the updater compares that with the tag. Ship
          # a version the changelog has never heard of and the copy that
          # installs it keeps calling itself the older one, so it downloads the
          # same update on every check for ever. 1.4.1 was tagged that way.
          want="$(printf '%s' "$VERSION" | sed 's/-\([a-z]\)/ \1/')"
          top="$(awk '/^## /{sub(/^## +/, ""); sub(/ +$/, ""); print; exit}' CHANGELOG.md)"
          if [ "$top" != "$want" ]; then
            echo "CHANGELOG.md starts at '$top', but this tag is '$want'."
            echo "Put a '## $want' section at the top of CHANGELOG.md and tag again."
            exit 1
          fi

      - name: Pack one release per system
        env:
          SYSTEMS: ${{ steps.which.outputs.systems }}
          VERSION: ${{ steps.which.outputs.version }}
        run: |
          set -eu
          v="v$VERSION"
          # git archive honours .gitattributes export-ignore and keeps the
          # executable bit that setup.sh and knoxmap.sh carry in the index.
          git archive --format=tar --prefix=KnoxMap/ -o base.tar HEAD
          for system in $SYSTEMS; do
            mkdir -p "pack/$system"
            tar -C "pack/$system" -xf base.tar
            case "$system" in
              windows)
                rm -f pack/windows/KnoxMap/*.sh
                # The launcher people double-click, built and run through by
                # the launcher workflow. It is not in the repository as a
                # binary, and it is no use on Linux or macOS.
                cp KnoxMap.exe pack/windows/KnoxMap/
                cp knoxlots/knoxlots-windows/knoxlots.exe pack/windows/KnoxMap/
                # KnoxMap.exe goes in last, and nothing may follow it.
                # Updaters up to 1.4.7.1 unpack a release in the order its
                # entries are stored and stop dead at the first file Windows
                # will not let them overwrite - which is this one, the file a
                # virus scanner holds open (#9). Stored last, everything else
                # is already in place when that happens, the fixed updater
                # among it, and a launcher left a version behind still finds
                # Python and starts KnoxMap. Without this an old copy was
                # stranded: half the release in, CHANGELOG.md among it, so it
                # read as the new version and never tried again.
                out="$GITHUB_WORKSPACE/KnoxMap-$v-windows.zip"
                (cd pack/windows && zip -qr "$out" KnoxMap -x 'KnoxMap/KnoxMap.exe')
                (cd pack/windows && zip -q "$out" KnoxMap/KnoxMap.exe)
                last=$(unzip -Z1 "$out" | grep -v '/$' | tail -1)
                [ "$last" = "KnoxMap/KnoxMap.exe" ] ||
                  { echo "KnoxMap.exe must be the last entry, got $last"; exit 1; }
                ;;
              *)
                rm -f "pack/$system/KnoxMap"/*.bat
                rm -rf "pack/$system/KnoxMap/win"
                # The Rust compiler for this system; a tarball keeps the executable bit.
                cp "knoxlots/knoxlots-$system/knoxlots" "pack/$system/KnoxMap/knoxlots"
                chmod +x "pack/$system/KnoxMap/knoxlots"
                (cd "pack/$system" && tar -czf "$GITHUB_WORKSPACE/KnoxMap-$v-$system.tar.gz" KnoxMap)
                # The launchers must still be executable inside the tarball.
                tar -tvzf "$GITHUB_WORKSPACE/KnoxMap-$v-$system.tar.gz" |
                  grep -E 'KnoxMap/(setup|knoxmap)\.sh' | grep -q 'rwxr-xr-x' ||
                  { echo "setup.sh is not executable in the $system tarball"; exit 1; }
                ;;
            esac
          done
          ls -l KnoxMap-$v-*

      - name: Notes from CHANGELOG.md
        env:
          SYSTEMS: ${{ steps.which.outputs.systems }}
          VERSION: ${{ steps.which.outputs.version }}
        run: |
          set -eu
          v="v$VERSION"
          # The tag spells a one-system release with a dash, the changelog
          # heading with a space: v1.3.9-mc1 is "## 1.3.9 mc1".
          version="$(printf '%s' "$VERSION" | sed 's/-\([a-z]\)/ \1/')"
          awk -v v="$version" '
            /^## / { on = (index($0, "## " v " ") == 1 || $0 == "## " v) ; next }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          {
            case "$SYSTEMS" in
              *' '*) ;;
              *) printf '\n**This release is for %s only.** Every other system stays\n' "$SYSTEMS"
                 printf 'where it is - there is nothing in here for it.\n' ;;
            esac
            printf '\n---\n**Install**\n\n'
            printf 'New to this? `tutorial.txt` in the download walks through it.\n\n'
            printf '| System | Download | Then |\n|---|---|---|\n'
            for system in $SYSTEMS; do
              case "$system" in
                windows) printf '| Windows 10/11 | `KnoxMap-%s-windows.zip` | unzip it and double-click `KnoxMap.exe` |\n' "$v" ;;
                linux)   printf '| Linux | `KnoxMap-%s-linux.tar.gz` | `tar -xzf` it, then `./setup.sh` and `./knoxmap.sh` |\n' "$v" ;;
                macos)   printf '| macOS | `KnoxMap-%s-macos.tar.gz` | `tar -xzf` it, then `./setup.sh` and `./knoxmap.sh` |\n' "$v" ;;
              esac
            done
            printf '\nLinux and macOS need 64-bit Python 3.10+ of your own; see LINUX.md.\n'
            printf '\n`KnoxMap.exe` finds Python, runs setup the first time and opens\n'
            printf 'the window. `KnoxMap.bat` is still in the folder and does the same,\n'
            printf 'for anyone who would rather read what they are running. Windows may\n'
            printf 'warn about an unsigned program the first time: More info, Run anyway.\n'
          } >> notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SYSTEMS: ${{ steps.which.outputs.systems }}
          VERSION: ${{ steps.which.outputs.version }}
        run: |
          set -eu
          v="v$VERSION"
          files=""
          for system in $SYSTEMS; do
            case "$system" in
              windows) files="$files KnoxMap-$v-windows.zip" ;;
              *)       files="$files KnoxMap-$v-$system.tar.gz" ;;
            esac
          done
          # Only a release for every system becomes "latest": that is what the
          # download links point at and what the updater asks for first, and
          # one system's fix is not the version everybody else should see.
          case "$SYSTEMS" in
            *' '*) latest=--latest ;;
            *)     latest=--latest=false ;;
          esac
          title="KnoxMap $(printf '%s' "$VERSION" | sed 's/-\([a-z]\)/ \1/')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Published by hand: the release page is already there and the
            # files are not, which is exactly what the updater cannot see.
            # Notes somebody wrote themselves are left alone; an empty one
            # gets the changelog.
            gh release upload "$TAG" $files --clobber
            body="$(gh release view "$TAG" --json body -q .body)"
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              gh release edit "$TAG" --title "$title" --notes-file notes.md
            fi
            gh release edit "$TAG" "$latest"
          else
            gh release create "$TAG" $files --title "$title" --notes-file notes.md "$latest"
          fi
          echo "on the release now:"
          gh release view "$TAG" --json assets -q '.assets[].name'
