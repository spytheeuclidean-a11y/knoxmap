name: launcher

# KnoxMap.exe: built with MSVC on Windows, then actually run on Windows.
#
# The launcher is the first thing a player touches, and it cannot be tested
# on the machine it is written on, so it is built and exercised here: a folder
# that has no environment yet must run Setup, and one that has must start
# the window and get out of the way.
#
# It was built with mingw-w64 on Linux until antivirus made that a bad trade.
# The launcher is a small binary whose whole job is two CreateProcessW calls,
# which is structurally what a dropper is, and mingw output is heavily
# over-represented in the corpora the heuristics are trained on. The same
# source built with the toolchain the rest of Windows software uses stops
# looking like the thing it is not. win/build_launcher.sh still builds it on
# Linux, and checks/nightly nothing - it is there so the binary that ships can
# be reproduced without Visual Studio.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build KnoxMap.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        shell: pwsh
        run: win\build_launcher.ps1

      - name: It is a 64-bit windowed exe with its details on it
        shell: pwsh
        run: |
          $b = [System.IO.File]::ReadAllBytes("KnoxMap.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          $subsystem = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($machine -ne 0x8664) { throw "not x86-64 (machine 0x$($machine.ToString('X4')))" }
          # 2 is IMAGE_SUBSYSTEM_WINDOWS_GUI: no console window of its own.
          if ($subsystem -ne 2) { throw "not a windowed exe (subsystem $subsystem)" }
          $v = (Get-Item KnoxMap.exe).VersionInfo
          if (-not $v.ProductName) { throw "no version details on it" }
          $want = (Select-String -Path CHANGELOG.md -Pattern '^##\s+(\d[\d.]*)' |
                   Select-Object -First 1).Matches[0].Groups[1].Value
          if ($v.FileVersion -notlike "$want*") {
            throw "says $($v.FileVersion), the changelog says $want"
          }
          Write-Host "ok: x64 GUI, $($v.ProductName) $($v.FileVersion), $((Get-Item KnoxMap.exe).Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: KnoxMap-exe
          path: KnoxMap.exe
          if-no-files-found: error

  # The same launcher from the same source, built the way somebody on Linux
  # would build it. Nothing ships from here; it is a check that the fallback
  # still compiles.
  mingw:
    name: It still builds with mingw-w64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq
             gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build
        run: |
          chmod +x win/build_launcher.sh
          win/build_launcher.sh
          file KnoxMap.exe
          file KnoxMap.exe | grep -qE 'PE32\+ executable \(GUI\) x86-64' ||
            { echo "not a windowed 64-bit exe"; exit 1; }

  run_it:
    name: Run it on Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KnoxMap-exe

      - name: It runs Setup when there is no environment yet
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $box = Join-Path $env:RUNNER_TEMP 'first-run'
          New-Item -ItemType Directory -Force $box | Out-Null
          Copy-Item KnoxMap.exe $box
          # The launcher checks its environment by running pythonw.exe on
          # knoxruntime.py, which here only has to exit 0.
          "raise SystemExit(0)" |
            Set-Content -Encoding ascii (Join-Path $box 'knoxruntime.py')
          # A stand-in for Setup.bat: it leaves the environment the launcher
          # is looking for, and a mark to say it ran.
          @"
          @echo off
          echo setup ran > "%~dp0setup-ran.txt"
          mkdir "%~dp0.venv\Scripts" 2>nul
          copy /y "$python" "%~dp0.venv\Scripts\pythonw.exe" >nul
          exit /b 0
          "@ | Set-Content -Encoding ascii (Join-Path $box 'Setup.bat')
          "open('started.txt','w').write('started')" |
            Set-Content -Encoding ascii (Join-Path $box 'knoxmap.py')
          Push-Location $box
          & .\KnoxMap.exe
          Start-Sleep -Seconds 10
          Pop-Location
          if (-not (Test-Path (Join-Path $box 'setup-ran.txt'))) {
            throw 'the launcher did not run Setup.bat'
          }
          if (-not (Test-Path (Join-Path $box '.venv\Scripts\pythonw.exe'))) {
            throw 'setup did not leave an environment behind'
          }
          if (-not (Test-Path (Join-Path $box 'started.txt'))) {
            throw 'the launcher ran Setup but never started the window'
          }
          Write-Host 'ok: no environment -> Setup ran, then the window started'

      - name: It starts the window and exits without holding the file
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $box = Join-Path $env:RUNNER_TEMP 'normal-run'
          New-Item -ItemType Directory -Force (Join-Path $box '.venv\Scripts') | Out-Null
          Copy-Item KnoxMap.exe $box
          # The real thing: pythonw.exe running knoxmap.py, which here only
          # writes a file and ends.
          Copy-Item $python (Join-Path $box '.venv\Scripts\pythonw.exe')
          # The readiness probe, which has to pass before the launcher starts
          # knoxmap.py at all.
          "raise SystemExit(0)" |
            Set-Content -Encoding ascii (Join-Path $box 'knoxruntime.py')
          "open('started.txt','w').write('started')" |
            Set-Content -Encoding ascii (Join-Path $box 'knoxmap.py')
          Push-Location $box
          $started = Get-Date
          & .\KnoxMap.exe
          $took = (Get-Date) - $started
          Start-Sleep -Seconds 10
          Pop-Location
          if (-not (Test-Path (Join-Path $box 'started.txt'))) {
            throw 'the launcher did not start pythonw.exe with knoxmap.py'
          }
          if ($took.TotalSeconds -gt 5) {
            throw "the launcher waited $($took.TotalSeconds)s instead of exiting"
          }
          # It must not hold its own file open, or an update cannot replace it.
          Set-Content -Path (Join-Path $box 'KnoxMap.exe') -Value 'replaced' -Force
          Write-Host 'ok: started the window, exited, and can be updated over'

