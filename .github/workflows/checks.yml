name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python-compatibility:
    name: Windows Python ${{ matrix.python }} startup
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install required Visual C++ runtime
        run: |
          python knoxruntime.py --check-vc
          if ($LASTEXITCODE -ne 0) {
            $installer = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
            Invoke-WebRequest 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') {
              throw 'Visual C++ runtime installer signature is not valid'
            }
            $result = Start-Process -FilePath $installer -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
            if ($result.ExitCode -notin @(0, 3010)) { throw "Visual C++ runtime install failed: $($result.ExitCode)" }
          }
          python knoxruntime.py --check-vc
          if ($LASTEXITCODE -ne 0) { throw 'Required Visual C++ runtime is not installed' }
      - name: Install the release dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the native launcher
        run: ./win/build_launcher.ps1
      - name: Verify runtime and startup recovery checks
        run: |
          python knoxruntime.py
          python -m unittest tests.test_runtime_bootstrap
          python -c "from app import app; assert app.test_client().get('/').status_code == 200"

  generator:
    name: Generator self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Everything but pywebview: the desktop window is not needed to
      # generate maps, and it pulls in GUI toolkits a server does not have.
      - name: Install dependencies
        run: |
          grep -v -i pywebview requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install ortools     # optional: the room solver's tests run with it

      - name: Python parses
        run: python -m compileall -q app.py knoxmap.py knoxmap_setup.py knoxpaths.py generator knoxbuild tools web worlded

      # Mistakes, not style: an undefined name, a comparison that is always
      # true, a statement that does nothing. pyproject.toml says why the wider
      # rule set is not here yet.
      - name: Lint
        run: |
          pip install -r requirements-dev.txt
          ruff check .

      - name: JavaScript parses
        run: |
          for f in static/js/*.js; do
            node -e "new Function(require('fs').readFileSync('$f', 'utf8'))" && echo "ok $f"
          done

      # An update deletes by .knoxmap_files.json: a module missing from it never
      # reaches anybody, and a line left behind makes every update try to delete
      # a file that is not there. Both are silent until a player reports one.
      - name: The shipped file list is the release
        run: python tools/check_manifest.py

      - name: Native terrain search for Python parity checks
        run: cargo build --release --locked --manifest-path rust/knoxroute/Cargo.toml

      - name: Overpass rotation, cooldown and tile cache (offline)
        run: python -m unittest discover tests

      - name: Whole pipeline on a made-up town (offline)
        run: python tools/selftest.py

      - name: Floor plans (sealed rooms, stairs, roofs, lifts)
        run: python tools/audit_layouts.py 200
